user nginx;
# 限制为 2 个 worker：ban_check.lua 的 xdb vectorIndex 缓存每 worker ~1MB，
# 数据段通过文件 IO 读取（内核页缓存多 worker 共享），内存占用极低
worker_processes 2;
error_log /var/log/nginx/error.log error;
pid /tmp/nginx.pid;

# 允许 Nginx worker 进程读取环境变量
# Lua 脚本通过 os.getenv("REDIS_PASSWORD") 获取密码，避免明文写在配置文件中
env REDIS_PASSWORD;
env REDIS_DB;
# 访客 IP 解析配置（SELF_PUBLIC_IPS / SELF_IP_FILE / TRUSTED_PROXY_CIDRS / REAL_IP_HEADER）
# 由 docker-compose 注入，详见 lua/real_ip_core.lua 头注释
env SELF_PUBLIC_IPS;
env SELF_IP_FILE;
env TRUSTED_PROXY_CIDRS;
env REAL_IP_HEADER;

# Brotli模块需要动态加载
load_module /usr/local/openresty/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/local/openresty/nginx/modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # 隐藏nginx版本信息，提高安全性
    server_tokens off;

    # Lua 脚本搜索路径
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # 封禁规则缓存（UA/CIDR/Region 规则快照 + 刷新时间戳）
    lua_shared_dict ban_rules_cache 1m;

    # 安全响应头在各 server 配置中使用 Nginx 原生 add_header 设置。

    # Docker DNS解析器 - 添加此行解决容器名解析问题
    resolver 127.0.0.11 valid=30s;

    # ===== 访客 IP 解析（可信代理链） =====
    # 解析逻辑位于 rewrite 阶段的 lua/real_ip_resolve.lua：从右向左扫描 XFF 链，
    # 跳过 无效 / 私有 / 服务器自身(SELF_PUBLIC_IPS) / 可信代理段(TRUSTED_PROXY_CIDRS)
    # 条目，第一个"可信之外"的 IP 即访客；REAL_IP_HEADER 可配置 CDN 注入的真实
    # 客户端头（如 EdgeOne 的 EO-Connecting-IP）优先采用。
    #
    # 为什么不再直接取 XFF 最右端：CDN 回源回环等场景下（源站反向代理指回自己的
    # CDN 域名），最右端会变成服务器自身公网 IP，导致其被自动拉黑（全站 403）
    # 并污染访问统计。解析结果写入 $real_client_ip_resolved（见下方 map）。
    # $remote_addr 保持为 TCP 对端不变（Java 端 isTrustedForwardedProxyAddress
    # 的可信判断依赖此事实）。
    #
    # 兜底：$real_client_ip_resolved 未写入（脚本未接线 / 执行失败）时，
    # $real_client_ip 回退 $remote_addr，语义安全。
    map $real_client_ip_resolved $real_client_ip {
        "~."    $real_client_ip_resolved;
        default $remote_addr;
    }

    # 下游只接收选定的单一访客 IP,避免 Java 或日志再次解析原始代理链。
    map $real_client_ip $forwarded_for_chain {
        default $real_client_ip;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$forwarded_for_chain"';

    log_format page_visit_json escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","xff":"$forwarded_for_chain",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"referer":"$http_referer","user_agent":"$http_user_agent",'
        '"accept":"$http_accept","accept_language":"$http_accept_language",'
        '"sec_fetch_site":"$http_sec_fetch_site","sec_fetch_mode":"$http_sec_fetch_mode",'
        '"sec_fetch_dest":"$http_sec_fetch_dest","sec_fetch_user":"$http_sec_fetch_user",'
        '"sec_ch_ua":"$http_sec_ch_ua","sec_ch_ua_platform":"$http_sec_ch_ua_platform",'
        '"upgrade_insecure_requests":"$http_upgrade_insecure_requests"}';

    # 只记录非静态资源的访问日志，减少日志量
    map $request_uri $loggable {
        ~*\.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|map)$ 0;
        ~^/media/ 0;
        ~*/api/ 0;
        ~*/ws/im 0;
        default 1;
    }

    map $request_method $page_visit_method_ok {
        default 0;
        GET 1;
        HEAD 1;
    }

    map $uri $page_visit_uri_excluded {
        default 0;
        ~^/(api|admin|track|webInfo|sysConfig|sysPlugin|resource|media|imageCompress|captcha|comment|family|qiniu|qrcode|imChat|collect|actuator|seo|python|ws|login|callback|oauth|internal_proxy)(/|$) 1;
        ~^/article/(getArticleByPathNoCount|getTranslation|getAvailableLanguages|getArticleSaveStatus|streamArticleSaveStatus|streamArticleSaveStatusBatch|listArticle|listSortArticle|saveArticle|saveArticleAsync|updateArticle|updateArticleAsync|deleteArticle)(/|$) 1;
        ~^/(favicon\.ico|robots\.txt|manifest\.json|sw\.js|sitemap\.xml|rss\.xml|feed|feed\.xml)$ 1;
        ~^/(static|css|js|images|assets|libs|uploads|upload|download|\.well-known)(/|$) 1;
        ~*\.(ico|css|js|mjs|gif|jpe?g|png|svg|webp|woff2?|ttf|eot|map|json|xml|txt|mp4|webm|ogg|avi|mov|flv|wmv|mkv)$ 1;
    }

    map $status $page_visit_status_ok {
        default 0;
        ~^[23] 1;
    }

    map "$page_visit_method_ok:$page_visit_status_ok:$page_visit_uri_excluded" $page_visit_loggable {
        default 0;
        "1:1:0" 1;
    }

    access_log /var/log/nginx/access.log main if=$loggable;
    access_log /var/log/nginx/page_visit.log page_visit_json if=$page_visit_loggable;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;


    # MIME类型已在mime.types中定义，无需重复添加

    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
}
